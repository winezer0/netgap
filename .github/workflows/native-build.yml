name: Native Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Native ${{ matrix.id }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            id: windows-amd64
            platform: windows/amd64
            cli: netgap.exe
          - os: ubuntu-22.04
            id: ubuntu-22.04-amd64
            platform: linux/amd64
            cli: netgap
            webkit_package: libwebkit2gtk-4.0-dev
          - os: ubuntu-24.04
            id: ubuntu-24.04-amd64
            platform: linux/amd64
            cli: netgap
            webkit_package: libwebkit2gtk-4.1-dev
            go_flags: -tags=webkit2_41
            wails_tags: webkit2_41
          - os: macos-15-intel
            id: macos-intel
            platform: darwin/amd64
            cli: netgap
          - os: macos-15
            id: macos-arm64
            platform: darwin/arm64
            cli: netgap
    env:
      CGO_ENABLED: "1"
      GOFLAGS: ${{ matrix.go_flags || '' }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cmd/netgapgui/frontend/package-lock.json

      - name: Confirm native toolchain
        run: |
          mkdir -p build/evidence build/artifacts
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            export VITE_APP_VERSION="$GITHUB_REF_NAME"
          else
            export VITE_APP_VERSION="dev-${GITHUB_SHA:0:7}"
          fi
          echo "VITE_APP_VERSION=$VITE_APP_VERSION" >> "$GITHUB_ENV"
          {
            echo "commit=$GITHUB_SHA"
            echo "run=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "runner=${{ matrix.os }}"
            echo "platform=${{ matrix.platform }}"
            echo "app_version=$VITE_APP_VERSION"
            echo "GOFLAGS=$GOFLAGS"
            go version
            go env GOHOSTOS GOHOSTARCH CGO_ENABLED
            node --version
            if [[ "$RUNNER_OS" == Linux ]]; then cat /etc/os-release; fi
            if [[ "$RUNNER_OS" == macOS ]]; then sw_vers; xcodebuild -version; fi
          } | tee build/evidence/environment.txt
          test "$(go env GOHOSTOS)/$(go env GOHOSTARCH)" = "${{ matrix.platform }}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config iproute2 libgtk-3-dev "${{ matrix.webkit_package }}" libglib2.0-bin gsettings-desktop-schemas dbus python3
          dpkg-query -W 'libwebkit2gtk*' 'libjavascriptcoregtk*' 'gsettings-desktop-schemas' | tee build/evidence/linux-packages.txt

      - name: Test all Go packages with race detection
        run: go test -race -v ./... -count=1 -timeout=180s 2>&1 | tee build/evidence/core-tests.txt

      - name: Test Linux route notifications
        if: runner.os == 'Linux'
        run: |
          go test -race -v ./internal/routenet -count=1 -timeout=60s 2>&1 | tee build/evidence/routenet-tests.txt

      - name: Compile native backends and CLI
        run: |
          go build ./internal/...
          mkdir -p build/cli
          go build -trimpath -o "build/cli/${{ matrix.cli }}" ./cmd/netgap

      - name: Test CLI route deletion and recovery in an isolated network namespace
        if: runner.os == 'Linux'
        run: |
          sudo bash scripts/test-cli-route-namespace.sh "build/cli/${{ matrix.cli }}" 2>&1 | tee build/evidence/cli-route-namespace.txt

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0

      - name: Generate GUI bindings
        working-directory: cmd/netgapgui
        run: wails generate module

      - name: Check frontend, compile and package native GUI
        working-directory: cmd/netgapgui
        env:
          WAILS_TAGS: ${{ matrix.wails_tags || '' }}
        run: |
          args=()
          if [[ -n "$WAILS_TAGS" ]]; then args+=(-tags "$WAILS_TAGS"); fi
          node build.mjs -clean -m -skipbindings -platform "${{ matrix.platform }}" "${args[@]}" 2>&1 | tee ../../build/evidence/gui-build.txt

      # Archive first: artifact ZIPs do not retain Unix executable permissions.
      - name: Archive Linux binaries
        if: runner.os == 'Linux'
        run: |
          tar -C cmd/netgapgui/build/bin -czf "build/artifacts/netgapgui-${{ matrix.id }}.tar.gz" netgapgui
          tar -C build/cli -czf "build/artifacts/netgap-${{ matrix.id }}.tar.gz" netgap
          ldd cmd/netgapgui/build/bin/netgapgui | tee build/evidence/gui-libraries.txt

      - name: Archive macOS binaries
        if: runner.os == 'macOS'
        run: |
          plutil -lint cmd/netgapgui/build/bin/netgapgui.app/Contents/Info.plist | tee build/evidence/app-plist-check.txt
          ditto -c -k --sequesterRsrc --keepParent cmd/netgapgui/build/bin/netgapgui.app "build/artifacts/netgapgui-${{ matrix.id }}.zip"
          tar -C build/cli -czf "build/artifacts/netgap-${{ matrix.id }}.tar.gz" netgap
          file cmd/netgapgui/build/bin/netgapgui.app/Contents/MacOS/netgapgui | tee build/evidence/gui-architecture.txt
          otool -L cmd/netgapgui/build/bin/netgapgui.app/Contents/MacOS/netgapgui | tee build/evidence/gui-libraries.txt

      - name: Archive Windows binaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path cmd/netgapgui/build/bin/netgapgui.exe -DestinationPath build/artifacts/netgapgui-${{ matrix.id }}.zip
          Compress-Archive -Path build/cli/netgap.exe -DestinationPath build/artifacts/netgap-${{ matrix.id }}.zip

      - name: Verify native archives before upload
        run: |
          python=python3
          if [[ "$RUNNER_OS" == Windows ]]; then python=python; fi
          "$python" -B -m unittest discover -s scripts -p test_native_artifacts.py -v 2>&1 | tee build/evidence/archive-verifier-tests.txt
          "$python" -B scripts/verify-native-artifacts.py build/artifacts --platform "${{ matrix.id }}" | tee build/evidence/archive-check.json

      - name: "Manual acceptance: Windows WPAD fallback"
        if: github.event_name == 'workflow_dispatch' && runner.os == 'Windows'
        run: go test -tags acceptance -race -v ./internal/detector -run TestNativeWPAD -count=1 -timeout=60s 2>&1 | tee build/evidence/wpad-acceptance.txt

      - name: "Manual acceptance: macOS native network watcher recovery"
        if: github.event_name == 'workflow_dispatch' && runner.os == 'macOS'
        run: go test -tags acceptance -race -v ./internal/macnetwork -run TestNativeNetworkWatcherRecoversAfterInvalidation -count=1 -timeout=30s 2>&1 | tee build/evidence/macos-watcher-acceptance.txt

      - name: "Install virtual display for manual Linux GUI startup"
        if: github.event_name == 'workflow_dispatch' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: "Manual acceptance: extract and start packaged GUI"
        if: github.event_name == 'workflow_dispatch' && runner.os != 'macOS'
        run: |
          python=python3
          if [[ "$RUNNER_OS" == Windows ]]; then python=python; fi
          "$python" -B scripts/smoke-native-gui.py "build/artifacts/netgapgui-${{ matrix.id }}.${{ runner.os == 'Linux' && 'tar.gz' || 'zip' }}" "${{ runner.os == 'Windows' && 'windows' || runner.os == 'macOS' && 'macos' || 'linux' }}" 2>&1 | tee build/evidence/gui-startup-acceptance.txt

      - name: Upload native binaries
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.id }}
          path: build/artifacts/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidence-${{ matrix.id }}
          path: build/evidence/
          if-no-files-found: warn
          retention-days: 14

      - name: Write validation summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## Native ${{ matrix.id }}: $JOB_STATUS"
            echo "Commit: $GITHUB_SHA"
            echo "Frontend lint, interaction tests and build-gate tests are mandatory for every GUI build; output is included in gui-build.txt."
            if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
              echo "Manual acceptance adds native platform checks where applicable and packaged GUI startup smoke on Windows/Linux."
              if [[ "$RUNNER_OS" == macOS ]]; then
                echo "macOS GUI process launch is unavailable on the hosted runner; app bundle/architecture checks and native watcher tests ran."
              fi
            else
              echo "Automatic build and automated tests. Manual desktop acceptance runs only through workflow_dispatch."
            fi
            echo "Artifacts: native-${{ matrix.id }} (on success), evidence-${{ matrix.id }}."
          } >> "$GITHUB_STEP_SUMMARY"
