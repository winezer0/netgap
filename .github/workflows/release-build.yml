name: Release Build

on:
  release:
    types: [published, prereleased]
  workflow_dispatch:
    inputs:
      version:
        description: Release version (e.g., v1.0.0)
        required: true
        type: string
        default: v0.0.1

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.event_name != 'release' || !contains(github.event.release.body, '<!-- netgap-release-build-created -->') }}
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            asset: netgapgui-windows-amd64.zip
          - os: ubuntu-22.04
            platform: linux/amd64
            asset: netgapgui-linux-amd64.tar.gz
          - os: macos-latest
            platform: darwin/universal
            asset: netgapgui-macos-universal.zip

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        id: setup-go
        with:
          go-version-file: go.mod
          cache: true

      - name: Add Go bin to PATH on Windows
        if: runner.os == 'Windows'
        env:
          GO_BIN_PATH: ${{ steps.setup-go.outputs.go-bin-path }}
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value $env:GO_BIN_PATH

      - name: Add Go bin to PATH on Unix
        if: runner.os != 'Windows'
        env:
          GO_BIN_PATH: ${{ steps.setup-go.outputs.go-bin-path }}
        shell: bash
        run: echo "$GO_BIN_PATH" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cmd/netgapgui/frontend/package-lock.json

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0

      - name: Build GUI
        working-directory: cmd/netgapgui
        run: wails build -clean -m -platform "${{ matrix.platform }}"

      - name: Archive Windows build
        if: runner.os == 'Windows'
        working-directory: cmd/netgapgui
        shell: pwsh
        run: Compress-Archive -Path build/bin/netgapgui.exe -DestinationPath netgapgui-windows-amd64.zip

      - name: Archive Linux build
        if: runner.os == 'Linux'
        working-directory: cmd/netgapgui
        run: tar -C build/bin -czf netgapgui-linux-amd64.tar.gz netgapgui

      - name: Archive macOS build
        if: runner.os == 'macOS'
        working-directory: cmd/netgapgui
        run: ditto -c -k --sequesterRsrc --keepParent build/bin/netgapgui.app netgapgui-macos-universal.zip

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: cmd/netgapgui/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 1

  publish:
    if: ${{ github.event_name != 'release' || !contains(github.event.release.body, '<!-- netgap-release-build-created -->') }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Create release if needed and upload builds
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.event.release.tag_name }}
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]] && ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            release_args=()
            if [[ "$RELEASE_TAG" == *-* ]]; then
              release_args+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" \
              --notes "<!-- netgap-release-build-created -->" \
              "${release_args[@]}"
          fi

          gh release upload "$RELEASE_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
